# Lint for the backend. Line length is generous because the response builders are dense by design.
line-length = 160
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S", "PL"]
ignore = [
  "S101",     # assert is used in tests
  "PLR2004",  # magic values are fine in a data-shaping layer
  "PLR0913",  # builder functions take many arguments
  "PLR0912", "PLR0915", "PLR0911",  # branch and statement counts
  "B008",     # FastAPI Depends/Query in defaults is the framework's idiom
]

[lint.per-file-ignores]
"tests/*" = ["S", "PLC0415", "E501", "PLR0917", "B905"]
"app/core/scoring.py" = ["E501"]  # byte-identical copy of data/sources/derived/scoring.py (see tests/test_scoring_sync.py)

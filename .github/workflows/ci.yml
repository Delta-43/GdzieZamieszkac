# Checks on every pull request and on every push to develop and main. They are the same commands the module READMEs give.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The live tests need the real database and are never run here.
      - run: python -m pytest -q -m "not live"

  city-service:
    name: City service (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: city-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: city-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The data API and the language model are faked. No key is needed or used.
      - run: python -m pytest -q

  frontend:
    name: Frontend (contracts, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # api:check fails when a generated type file differs from its contract (backend and city service).
      - run: npm run check

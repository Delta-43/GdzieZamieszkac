# Publishes the static demo of the app (sample data, no server) to GitHub Pages.
# The demo is the frontend built with `--mode demo`: it answers from data bundled with the app, so the site needs no secrets,
# no backend and no other service. See frontend/README.md, "Demo for GitHub Pages".
# Pages itself is switched on in the repository settings (Pages, source: GitHub Actions); this file does not do that.
name: Pages

on:
  push:
    branches: [main]
  # A pull request only checks that the demo builds. It is never deployed.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type check, then a production build with the base path /GdzieZamieszkac/.
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
